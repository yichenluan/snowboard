name: Deploy snowboard guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install locked prototype dependencies
        run: |
          if ! npm ci > npm-install.log 2>&1; then
            tail -n 80 npm-install.log
            exit 1
          fi

      - name: Validate and build 3D prototype
        run: |
          if ! npm run typecheck > prototype-typecheck.log 2>&1; then
            tail -n 80 prototype-typecheck.log
            exit 1
          fi
          if ! npm test > prototype-test.log 2>&1; then
            tail -n 80 prototype-test.log
            exit 1
          fi
          if ! npm run build:prototype > prototype-build.log 2>&1; then
            tail -n 80 prototype-build.log
            exit 1
          fi
          if ! npm run build:lessons > lessons-build.log 2>&1; then
            tail -n 80 lessons-build.log
            exit 1
          fi

      - name: Build self-contained HTML
        run: |
          node scripts/inventory-animations.mjs --check
          node scripts/inventory-teaching.mjs --check
          if ! python3 build.py > build.log 2>&1; then
            tail -n 80 build.log
            exit 1
          fi
          mkdir -p _site
          cp index.html _site/index.html
          cp snowboard-guide.html _site/snowboard-guide.html
          cp -R 3d _site/3d
          touch _site/.nojekyll

      - name: Upload public site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
